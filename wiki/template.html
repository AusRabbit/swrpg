<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__CAMPAIGN_HTML__</title>
<meta name="description" content="__DESCRIPTION_HTML__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9;
    --ink:#191D23; --muted:#59636F; --line:#D6DBE1;
    --amber:#A66A12; --amber-soft:#F0E2CA;
    --teal:#1B6B67; --teal-soft:#D9EAE8;
    --rust:#9C3B2E; --rust-soft:#F2DFDB;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Source Sans 3",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sp:clamp(16px,3vw,28px);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
      --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
      --amber:#DFA244; --amber-soft:#3A2F1C;
      --teal:#56B4AD; --teal-soft:#16302F;
      --rust:#D4776A; --rust-soft:#3A221E;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#13161A; --surface:#1B1F25; --surface-2:#22272E;
    --ink:#E4E8ED; --muted:#939DA9; --line:#2E353E;
    --amber:#DFA244; --amber-soft:#3A2F1C;
    --teal:#56B4AD; --teal-soft:#16302F;
    --rust:#D4776A; --rust-soft:#3A221E;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.6;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; font-weight:600}
  code{font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:1px 5px; border-radius:3px}

  .shell{display:grid; grid-template-columns:270px minmax(0,1fr)}
  @media (max-width:820px){ .shell{grid-template-columns:minmax(0,1fr)} }

  .rail{
    border-right:1px solid var(--line); background:var(--surface);
    padding:var(--sp) 0 48px; position:sticky; top:env(safe-area-inset-top,0px);
    align-self:start; min-height:100vh; max-height:100vh; overflow-y:auto;
  }
  @media (max-width:820px){
    .rail{position:static; min-height:0; max-height:none; border-right:0; border-bottom:1px solid var(--line); padding-bottom:20px}
  }
  .brand{padding:0 20px 18px; border-bottom:1px solid var(--line); margin-bottom:14px}
  .brand .ship{font-family:var(--display); font-size:21px; font-weight:700; line-height:1.15; letter-spacing:-.01em}
  .brand .sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:7px}

  .search{margin:0 20px 16px}
  .search input{
    width:100%; padding:8px 11px; border-radius:7px; font-family:var(--body); font-size:14px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--amber); outline-offset:1px}

  .grp{margin-bottom:16px}
  .grp > .lbl{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); padding:0 20px; margin-bottom:5px}
  .nav a{display:flex; align-items:baseline; gap:8px; justify-content:space-between; padding:5px 20px; text-decoration:none; font-size:14.5px; border-left:2px solid transparent}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{border-left-color:var(--amber); background:var(--surface-2); font-weight:600}
  .nav a:focus-visible{outline:2px solid var(--amber); outline-offset:-2px}
  .nav a .n{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

  main{padding:var(--sp); padding-block:calc(var(--sp) + 6px) 90px; max-width:820px}
  .crumb{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .ttl{font-size:clamp(28px,5vw,40px); line-height:1.08; letter-spacing:-.02em; margin-bottom:6px}
  .dek{color:var(--muted); font-size:17px; margin-bottom:22px}

  .badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:4px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
  .tag.t-character{background:var(--teal-soft); color:var(--teal); border-color:transparent}
  .tag.t-place{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-ship{background:var(--amber-soft); color:var(--amber); border-color:transparent}
  .tag.t-faction{background:var(--rust-soft); color:var(--rust); border-color:transparent}
  .conf{display:inline-flex; align-items:center; gap:5px}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
  .dot.hi{background:var(--teal)} .dot.mid{background:var(--amber)} .dot.lo{background:var(--rust)}

  .prose p{margin:0 0 15px}
  .prose h2{font-size:15px; letter-spacing:.02em; margin:30px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line)}
  .prose ul{margin:0 0 16px; padding-left:20px}
  .prose li{margin-bottom:7px}
  .prose em{color:var(--muted)}
  .fig{margin:4px 0 22px}
  .fig img{display:block; max-width:100%; max-height:640px; width:auto; height:auto; border-radius:9px; border:1px solid var(--line)}
  .fig figcaption{font-size:13px; color:var(--muted); margin-top:7px}

  a.wl{color:var(--teal); text-decoration:none; border-bottom:1px solid color-mix(in srgb, var(--teal) 35%, transparent); padding-bottom:.5px}
  a.wl:hover{border-bottom-color:var(--teal); background:var(--teal-soft)}
  a.wl.missing{color:var(--rust); border-bottom-style:dotted; border-bottom-color:var(--rust)}

  .panel{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:16px 18px; margin:0 0 18px}
  .panel .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px}
  .panel p{margin:0}
  .panel.note{background:var(--surface-2)}
  .panel.warn{border-left:3px solid var(--rust)}

  .alias{display:inline-block; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--muted)}

  .backlinks{margin-top:34px; padding-top:16px; border-top:1px solid var(--line)}
  .backlinks .ph{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
  .backlinks ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
  .backlinks li a{font-size:13.5px; text-decoration:none; padding:3px 9px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line)}
  .backlinks li a:hover{border-color:var(--teal); color:var(--teal)}

  .thread{border-left:2px solid var(--line); padding:0 0 2px 15px; margin-bottom:20px}
  .thread.open{border-left-color:var(--amber)}
  .thread.hot{border-left-color:var(--rust)}
  .thread h3{font-size:16.5px; margin-bottom:3px}
  .thread .st{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  .thread p{margin:0; font-size:15px}

  .beat{display:grid; grid-template-columns:70px minmax(0,1fr); gap:14px; margin-bottom:16px}
  @media (max-width:520px){ .beat{grid-template-columns:minmax(0,1fr); gap:2px} }
  .beat .t{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:4px}
  .beat .b p{margin:2px 0 0; font-size:14.5px; color:var(--muted)}

  .talent-controls{display:grid; grid-template-columns:minmax(180px,2fr) repeat(4,minmax(110px,1fr)); gap:10px; margin:0 0 12px}
  .talent-badges{display:flex; gap:6px; flex:none}
  .talent-force{flex:none; font:10.5px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:2px 7px}
  .dg{width:1.05em; height:1.05em; vertical-align:-0.25em; object-fit:contain; margin:0 1px; padding:1.5px; box-sizing:content-box; background:#16191b; border-radius:4px}
  .dg.die{background:none; padding:0; width:1.2em; height:1.2em}
  .halfpip{font-family:"Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols 2","Apple Symbols",sans-serif}
  .talent-key{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:10px 14px; margin:0 0 14px}
  .talent-key summary{cursor:pointer; font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .talent-key-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px 14px; margin-top:10px; font-size:13.5px}
  .talent-controls input,.talent-controls select{width:100%; min-width:0; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); font:14px var(--body)}
  .talent-controls input:focus,.talent-controls select:focus{outline:2px solid var(--amber); outline-offset:1px}
  .talent-summary{font:11px var(--mono); color:var(--muted); margin-bottom:14px}
  .talent-list{display:grid; gap:10px}
  .talent-card{border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:14px 16px}
  .talent-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:5px}
  .talent-head h2{font-size:18px; line-height:1.2; border:0; padding:0; margin:0}
  .talent-tier{flex:none; font:10.5px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--amber); background:var(--amber-soft); border-radius:4px; padding:3px 7px}
  .talent-meta{font:10.5px var(--mono); color:var(--muted); margin-bottom:8px}
  .talent-card p{margin:0 0 8px}
  .talent-source{font-size:12.5px; color:var(--muted)}
  .talent-note{font-size:12.5px; color:var(--rust); margin-top:7px}
  .talent-empty{border:1px dashed var(--line); border-radius:9px; color:var(--muted); padding:22px; text-align:center}
  @media (max-width:720px){.talent-controls{grid-template-columns:1fr 1fr}.talent-controls input{grid-column:1/-1}}
  @media (max-width:460px){.talent-controls{grid-template-columns:1fr}.talent-controls input{grid-column:auto}}

  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}

  .themebtn{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px));
    border:1px solid var(--line); background:var(--surface); color:var(--muted);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 11px; border-radius:6px; cursor:pointer;
  }
  .themebtn:hover{color:var(--ink); border-color:var(--amber)}
  @media (prefers-reduced-motion:no-preference){ .nav a,a.wl,.backlinks li a{transition:background .12s,color .12s,border-color .12s} }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="ship">__CAMPAIGN_HTML__</div>
      <div class="sub">__TAGLINE_HTML__</div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Filter the index&hellip;" aria-label="Filter index"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>
<button class="themebtn" id="themebtn" type="button">Theme</button>

<script>
const PAGES  = /*__PAGES__*/;
const TITLES = /*__TITLES__*/;
const TALENTS = /*__TALENTS__*/;
const GLYPHS = /*__GLYPHS__*/;

// Rules text -> escaped HTML with each shorthand glyph drawn as its die or
// symbol image (see TALENT_GLYPHS in build.py).
function rulesHtml(text){
  return Array.from(String(text == null ? "" : text)).map(ch => {
    if(ch === "️") return "";
    if(ch === "◑") return '<span class="halfpip" title="Force point of either side">◑</span>';
    const g = GLYPHS[ch];
    return g && g.src ? '<img class="dg' + (/ die$/.test(g.label) ? ' die' : '') + '" src="' + g.src + '" alt="' + esc(g.label) + '" title="' + esc(g.label) + '">' : esc(ch);
  }).join("");
}

function talentKey(){
  return '<details class="talent-key"><summary>Symbol key</summary><div class="talent-key-grid">'
    + Object.entries(GLYPHS).map(([ch, g]) => '<div>' + rulesHtml(ch) + ' ' + esc(g.label) + '</div>').join('')
    + '<div>' + rulesHtml("◑") + ' Force point of either side</div></div></details>';
}
const BUILT  = "__BUILT__";
const CAMPAIGN = /*__CAMPAIGN_JSON__*/;
const SOURCE_NOTE = /*__SOURCE_NOTE__*/;
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
let current = PAGES.length ? PAGES[0].id : "";

const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const q    = document.getElementById("q");

function esc(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function activationGroup(value){
  const a = String(value || "").toLowerCase();
  if(a === "passive") return "Passive";
  if(a.includes("out of turn") || a.includes("out-of-turn") || a.includes("oot")) return "Out of turn";
  if(a.includes("action")) return "Action";
  if(a.includes("maneuver")) return "Maneuver";
  return "Incidental";
}

function talentLibrary(){
  const tiers = [...new Set(TALENTS.map(t => t.tier))].sort((a,b) => a-b);
  return talentKey() + '<div class="talent-controls">'
    + '<input id="talent-q" type="search" placeholder="Search names, rules or sources&hellip;" aria-label="Search talents">'
    + '<select id="talent-tier" aria-label="Filter by tier"><option value="">All tiers</option>' + tiers.map(t => '<option value="' + t + '">Tier ' + t + '</option>').join('') + '</select>'
    + '<select id="talent-activation" aria-label="Filter by activation"><option value="">All activations</option><option>Passive</option><option>Action</option><option>Maneuver</option><option>Incidental</option><option>Out of turn</option></select>'
    + '<select id="talent-ranked" aria-label="Filter by ranked status"><option value="">Ranked or unranked</option><option value="Yes">Ranked</option><option value="No">Unranked</option></select>'
    + '<select id="talent-force" aria-label="Filter by Force talents"><option value="">Force and non-Force</option><option value="Yes">Force talents only</option><option value="No">Non-Force talents</option></select>'
    + '</div><div class="talent-summary" id="talent-summary"></div><div class="talent-list" id="talent-list"></div>';
}

function wireTalentLibrary(){
  const search = document.getElementById("talent-q");
  if(!search) return;
  const tier = document.getElementById("talent-tier");
  const activation = document.getElementById("talent-activation");
  const ranked = document.getElementById("talent-ranked");
  const force = document.getElementById("talent-force");
  const list = document.getElementById("talent-list");
  const summary = document.getElementById("talent-summary");
  function update(){
    const needle = search.value.trim().toLowerCase();
    const matches = TALENTS.filter(t =>
      (!needle || t.search.includes(needle)) &&
      (!tier.value || String(t.tier) === tier.value) &&
      (!activation.value || activationGroup(t.activation) === activation.value) &&
      (!ranked.value || t.ranked === ranked.value) &&
      (!force.value || (t.force || "No") === force.value)
    );
    summary.textContent = matches.length + (matches.length === 1 ? " talent" : " talents") + " shown of " + TALENTS.length;
    list.innerHTML = matches.length ? matches.map(t =>
      '<article class="talent-card"><div class="talent-head"><h2>' + esc(t.name) + '</h2><span class="talent-badges">' + (t.force === "Yes" ? '<span class="talent-force">Force</span>' : '') + '<span class="talent-tier">Tier ' + esc(t.tier) + '</span></span></div>'
      + '<div class="talent-meta">' + esc(t.activation) + ' · ' + (t.ranked === "Yes" ? "Ranked" : "Unranked") + '</div>'
      + '<p>' + rulesHtml(t.text) + '</p>'
      + '<div class="talent-source">Source: ' + esc(t.source || "Not listed") + (t.from && t.from !== t.name ? ' · Adapted from ' + esc(t.from) : '') + '</div>'
      + (t.superseded ? '<div class="talent-note">Superseded by version: ' + esc(t.superseded) + '</div>' : '')
      + (t.notes ? '<div class="talent-note">' + esc(t.notes) + '</div>' : '')
      + '</article>').join('') : '<div class="talent-empty">No talents match these filters.</div>';
  }
  [search,tier,activation,ranked,force].forEach(el => el.addEventListener(el === search ? "input" : "change", update));
  update();
}

function renderPage(id){
  const p = byId[id];
  if(!p) return "<p>Page not found.</p>";
  let h = '<div class="crumb">' + p.group + '</div>';
  h += '<h1 class="ttl">' + p.title + '</h1>';
  if(p.dek) h += '<div class="dek">' + p.dek + '</div>';

  if(p.type !== "doc"){
    h += '<div class="badges"><span class="tag t-' + p.type + '">' + p.typeLabel + '</span>';
    if(p.player) h += '<span class="tag">Played by ' + p.player + '</span>';
    if(p.conf)   h += '<span class="tag"><span class="conf"><span class="dot ' + p.conf + '"></span>' + p.confLabel + '</span></span>';
    h += '</div>';
    if(p.aka && p.aka.length){
      h += '<div class="panel"><div class="ph">Also known as</div><div>'
         + p.aka.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
    if(p.aliases.length){
      h += '<div class="panel"><div class="ph">Also transcribed as</div><div>'
         + p.aliases.map(a => '<span class="alias">' + a + '</span>').join('')
         + '</div></div>';
    }
  }

  h += '<div class="prose">' + p.html + '</div>';
  if(p.layout === "talents") h += talentLibrary();

  if(p.backlinks.length){
    h += '<div class="backlinks"><div class="ph">Mentioned in</div><ul>'
       + p.backlinks.map(b => '<li><a href="#' + b + '">' + TITLES[b] + '</a></li>').join('')
       + '</ul></div>';
  }

  h += '<div class="foot">' + SOURCE_NOTE + ' Built ' + BUILT + '.</div>';
  return h;
}

function renderNav(filter){
  const f = (filter || "").trim().toLowerCase();
  const groups = [];
  PAGES.forEach(p => {
    if(f && p.search.indexOf(f) === -1) return;
    let g = groups.find(x => x.name === p.group);
    if(!g){ g = {name:p.group, items:[]}; groups.push(g); }
    g.items.push(p);
  });
  if(!groups.length) return '<div style="padding:4px 20px;color:var(--muted);font-size:14px">Nothing matches.</div>';
  return groups.map(g =>
    '<div class="grp"><div class="lbl">' + g.name + '</div>'
    + g.items.map(p =>
        '<a href="#' + p.id + '"' + (p.id === current ? ' aria-current="page"' : '') + '>'
        + '<span>' + p.title + '</span>'
        + (p.type !== "doc" && p.backlinks.length ? '<span class="n">' + p.backlinks.length + '</span>' : '')
        + '</a>').join('')
    + '</div>').join('');
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  current = byId[id] ? id : (PAGES.length ? PAGES[0].id : "");
  main.innerHTML = renderPage(current);
  if(byId[current] && byId[current].layout === "talents") wireTalentLibrary();
  nav.innerHTML = renderNav(q.value);
  document.title = (byId[current] ? byId[current].title + " · " : "") + CAMPAIGN;
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
q.addEventListener("input", function(){ nav.innerHTML = renderNav(q.value); });

document.getElementById("themebtn").addEventListener("click", function(){
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const dark = now ? now === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("wd-theme", dark ? "light" : "dark"); } catch(e){}
});
try {
  const saved = localStorage.getItem("wd-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
} catch(e){}

route();
</script>
</body>
</html>
