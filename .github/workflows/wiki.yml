# Builds wiki/ into a single page (wiki/build.py) and publishes it to
# GitHub Pages at https://<owner>.github.io/<repo>/.
#
# Cloudflare is not involved: the dashboard Worker only builds dashboard/.
# One-time setup on GitHub: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "reference/talents.json"
      - "dashboard/public/images/symbol-*.png"
      - "dashboard/public/images/die-*.png"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wiki
        run: python wiki/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
